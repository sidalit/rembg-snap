name: rembg
base: core26
version: '2.0.86'
title: rembg
icon: snap/gui/rembg.png
summary: Remove image backgrounds from the command line or a local web UI
description: |
  rembg removes the background from images with pretrained segmentation
  models (U2-Net, BiRefNet, BRIA RMBG, SAM and others) with ONNX Runtime.
  It processes single files, whole folders, binary streams, or serves an
  HTTP API with a browser interface. CPU support is included; NVIDIA GPU
  support is available through the optional cuda component.

  **Examples**

     rembg i ~/Pictures/photo.jpg ~/Pictures/photo-cut.png
     rembg i -m birefnet-general -a ~/Pictures/photo.jpg out.png
     rembg p ~/Pictures/input ~/Pictures/output
     cat photo.jpg | rembg i > photo-cut.png
     rembg s
     rembg d bria-rmbg

  **Models**

  Models are downloaded on first use and kept in
  ~/snap/rembg/common/models, which survives snap refreshes. Custom models
  passed with model_path must be placed under ~/snap/rembg/common.

  **File access**

  rembg can use images in your home directory. To also use USB drives and
  other removable media (/media, /mnt), run:

     sudo snap connect rembg:removable-media
license: MIT
grade: stable
confinement: strict
website: https://github.com/danielgatis/rembg
source-code:
  - https://github.com/danielgatis/rembg
  - https://github.com/sidalit/rembg-snap
issues:
  - https://github.com/danielgatis/rembg/issues
  - https://github.com/sidalit/rembg-snap/issues
contact: https://github.com/sidalit/rembg-snap/issues

assumes:
  - snapd2.67

platforms:
  amd64:
  arm64:

plugs:
  # Python multiprocessing needs private POSIX semaphores.
  shmem:
    interface: shared-memory
    private: true

apps:
  rembg:
    command-chain: [bin/rembg-launch]
    command: bin/rembg
    plugs:
      - desktop
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - shmem
    environment:
      # Prefer the virtual environment's Python.
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      BROWSER: /usr/bin/xdg-open
      U2NET_HOME: $SNAP_USER_COMMON
      # The default numba cache is beside read-only package files.
      NUMBA_CACHE_DIR: $SNAP_USER_COMMON/numba-cache
      CUDA_CACHE_PATH: $SNAP_USER_COMMON/nvidia-cache
      GRADIO_ANALYTICS_ENABLED: 'False'

parts:
  rembg:
    plugin: python
    source: https://github.com/danielgatis/rembg.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    python-packages:
      - '.[cpu,cli]'
      - onnxruntime==1.31.1
    build-packages:
      # poetry-dynamic-versioning reads the version from the git tag.
      - git
      - patch
    stage-packages:
      - python3-venv
    override-pull: |
      craftctl default
      patch -p1 < "$CRAFT_PROJECT_DIR/snap/patches/localhost-default.patch"
    override-build: |
      craftctl default
      install -Dm644 LICENSE.txt "$CRAFT_PART_INSTALL/share/doc/rembg/LICENSE"
    prime:
      - -lib/python3.*/site-packages/numpy/**/tests
      - -lib/python3.*/site-packages/scipy/**/tests
      - -lib/python3.*/site-packages/skimage/**/tests
      - -lib/python3.*/site-packages/pandas/tests
      - -lib/python3.*/site-packages/numba/tests
      - -lib/python3.*/site-packages/llvmlite/tests
      - -lib/python3.*/site-packages/pymatting/tests

  cuda:
    plugin: nil
    build-packages:
      - python3-venv
    override-build: |
      /usr/bin/python3 -m venv venv
      venv/bin/python3 -m pip install --no-cache-dir --no-compile \
        'onnxruntime-gpu[cuda,cudnn]==1.31.1'
      # Common Python dependencies are already supplied by the CPU runtime.
      mkdir -p "$CRAFT_PART_INSTALL/site-packages"
      mv venv/lib/python*/site-packages/onnxruntime* \
        venv/lib/python*/site-packages/nvidia* "$CRAFT_PART_INSTALL/site-packages/"
    organize:
      '*': (component/cuda)

  launcher:
    plugin: dump
    source: snap/local
    organize:
      rembg-launch: bin/rembg-launch

components:
  cuda:
    type: standard
    summary: ONNX Runtime with CUDA for NVIDIA GPUs
    description: GPU-enabled ONNX Runtime with CUDA 13 and cuDNN runtime libraries.
